name: Build TAPAK Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdlinetools.zip
            unzip -q /tmp/cmdlinetools.zip -d /tmp/cmdlinetools_extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdlinetools_extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdlinetools.zip /tmp/cmdlinetools_extract
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle assembleDebug --no-daemon

      - name: Extract APK SHA-1 Fingerprint
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "File APK tidak ditemukan."
            exit 1
          fi

          CERT_INFO=$(keytool -list -printcert -jarfile "$APK_PATH" 2>&1 || true)
          echo "$CERT_INFO"

          SHA1_VALUE=$(echo "$CERT_INFO" | grep -i "SHA1" | head -n 1 | cut -d':' -f2- | xargs)

          if [ -z "$SHA1_VALUE" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            SHA1_VALUE=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android 2>&1 | grep -i "SHA1" | head -n 1 | cut -d':' -f2- | xargs)
          fi

          echo "APK File: $APK_PATH"
          echo "SHA-1: $SHA1_VALUE"

          {
            echo "### Android Signing SHA-1"
            echo "- **APK:** \`$APK_PATH\`"
            echo "- **SHA-1:** \`${SHA1_VALUE:-Tidak ditemukan di sertifikat}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPAK-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
