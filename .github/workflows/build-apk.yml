name: Build TAPAK APK, Bump Version & Auto Update JSON

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Skip Auto-Bump Loop on Bot Commit
        id: check_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s || true)
          if echo "$COMMIT_MSG" | grep -q "\[skip ci\]"; then
            echo "is_bot_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_bot_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versionCode in app/build.gradle
        if: steps.check_commit.outputs.is_bot_commit == 'false'
        run: |
          GRADLE_FILE="app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "File $GRADLE_FILE tidak ditemukan."
            exit 1
          fi

          CURRENT_VC=$(grep -E "versionCode[[:space:]]+[0-9]+" "$GRADLE_FILE" | head -n 1 | grep -oE "[0-9]+")
          CURRENT_VC="${CURRENT_VC:-1}"
          NEXT_VC=$((CURRENT_VC + 1))

          sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode ${NEXT_VC}/" "$GRADLE_FILE"
          echo "versionCode diperbarui dari ${CURRENT_VC} menjadi ${NEXT_VC}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdlinetools.zip
            unzip -q /tmp/cmdlinetools.zip -d /tmp/cmdlinetools_extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdlinetools_extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdlinetools.zip /tmp/cmdlinetools_extract
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Prepare Consistent Signing Keystore
        run: |
          KS_PATH="$HOME/.android/tapak-signing.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_PATH"
          elif [ ! -f "$KS_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias tapakkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tapak123 \
              -keypass tapak123 \
              -dname "CN=TAPAK, OU=Dev, O=TAPAK, L=Surabaya, S=East Java, C=ID" >/dev/null 2>&1
          fi

      - name: Build APK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle clean assembleDebug --no-daemon

      - name: Sign APK, Extract to Repo & Generate update.json
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ] || [ ! -f "$BUILT_APK" ]; then
            echo "File APK hasil build tidak ditemukan."
            exit 1
          fi

          KS_PATH="$HOME/.android/tapak-signing.keystore"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD:-tapak123 }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS:-tapakkey }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD:-tapak123 }}"

          mkdir -p releases
          FINAL_APK="releases/tapak-latest.apk"
          cp "$BUILT_APK" "$FINAL_APK"

          if command -v apksigner >/dev/null 2>&1 && [ -f "$KS_PATH" ]; then
            apksigner sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              "$FINAL_APK"
          fi

          VERSION_CODE=$(grep -E "versionCode[[:space:]]+[0-9]+" app/build.gradle | head -n 1 | grep -oE "[0-9]+")
          VERSION_NAME=$(grep -E "versionName[[:space:]]+['\"][^'\"]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          VERSION_CODE="${VERSION_CODE:-1}"
          VERSION_NAME="${VERSION_NAME:-1.0}"

          LAST_COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          REPO_SLUG="${GITHUB_REPOSITORY}"
          APK_DIRECT_URL="https://raw.githubusercontent.com/${REPO_SLUG}/${BRANCH_NAME}/${FINAL_APK}"

          cat <<EOF > update.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "changelog": "${LAST_COMMIT_MSG}",
            "apkUrl": "${APK_DIRECT_URL}"
          }
          EOF

          CERT_INFO=$(keytool -list -printcert -jarfile "$FINAL_APK" 2>&1 || true)
          SHA1_VALUE=$(echo "$CERT_INFO" | grep -iE "SHA1|SHA-1" | head -n 1 | cut -d':' -f2- | xargs)
          SHA256_VALUE=$(echo "$CERT_INFO" | grep -iE "SHA256|SHA-256" | head -n 1 | cut -d':' -f2- | xargs)

          {
            echo "### TAPAK Build, APK in Repo & Auto-Update JSON"
            echo "- **Version:** \`v${VERSION_NAME} (code ${VERSION_CODE})\`"
            echo "- **APK File in Repo:** \`${FINAL_APK}\`"
            echo "- **Direct APK URL:** ${APK_DIRECT_URL}"
            echo "- **SHA-1:** \`${SHA1_VALUE:-Tidak ditemukan}\`"
            echo "- **SHA-256:** \`${SHA256_VALUE:-Tidak ditemukan}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit Bumped Gradle, APK & update.json to Repository
        if: steps.check_commit.outputs.is_bot_commit == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle releases/tapak-latest.apk update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump versionCode, publish APK & update.json [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Tidak ada perubahan untuk di-commit."
          fi
