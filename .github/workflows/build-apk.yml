name: Build TAPAK Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdlinetools.zip
            unzip -q /tmp/cmdlinetools.zip -d /tmp/cmdlinetools_extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdlinetools_extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdlinetools.zip /tmp/cmdlinetools_extract
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Consistent Debug Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS_PATH="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
          elif [ ! -f "$KS_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=TAPAK, OU=Dev, O=TAPAK, L=Surabaya, S=East Java, C=ID" >/dev/null 2>&1
          fi

      - name: Clean and Build Debug APK
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --refresh-dependencies --no-daemon
          else
            gradle clean assembleDebug --refresh-dependencies --no-daemon
          fi

      - name: Sign APK, Copy to Repo, Generate update.json & Extract SHA-1 & SHA-256
        env:
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "File APK tidak ditemukan."
            exit 1
          fi

          KS_PATH="$HOME/.android/debug.keystore"
          STORE_PASS="${SECRET_STORE_PASS:-android}"
          KEY_ALIAS="${SECRET_KEY_ALIAS:-androiddebugkey}"
          KEY_PASS="${SECRET_KEY_PASS:-android}"

          if command -v apksigner >/dev/null 2>&1 && [ -f "$KS_PATH" ]; then
            apksigner sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              "$APK_PATH"
          fi

          mkdir -p releases
          FINAL_APK="releases/tapak-latest.apk"
          cp "$APK_PATH" "$FINAL_APK"

          VERSION_CODE=$(grep -E "versionCode[[:space:]]+[0-9]+" app/build.gradle | head -n 1 | grep -oE "[0-9]+" || echo "1")
          VERSION_NAME=$(grep -E "versionName[[:space:]]+['\"][^'\"]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/" || echo "1.0")
          LAST_COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          REPO_SLUG="${GITHUB_REPOSITORY}"
          APK_DIRECT_URL="https://raw.githubusercontent.com/${REPO_SLUG}/${BRANCH_NAME}/${FINAL_APK}"

          cat <<EOF > update.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "changelog": "${LAST_COMMIT_MSG}",
            "apkUrl": "${APK_DIRECT_URL}"
          }
          EOF

          CERT_INFO=$(keytool -list -printcert -jarfile "$FINAL_APK" 2>&1 || true)
          SHA1_VALUE=$(echo "$CERT_INFO" | grep -iE "SHA1|SHA-1" | head -n 1 | cut -d':' -f2- | xargs)
          SHA256_VALUE=$(echo "$CERT_INFO" | grep -iE "SHA256|SHA-256" | head -n 1 | cut -d':' -f2- | xargs)

          echo "APK File: $FINAL_APK"
          echo "SHA-1: ${SHA1_VALUE:-Tidak ditemukan}"
          echo "SHA-256: ${SHA256_VALUE:-Tidak ditemukan}"

          {
            echo "### Android Signing Fingerprints & Auto-Update"
            echo "- **APK:** \`$FINAL_APK\`"
            echo "- **Direct APK URL:** ${APK_DIRECT_URL}"
            echo "- **Version:** \`v${VERSION_NAME} (code ${VERSION_CODE})\`"
            echo "- **SHA-1:** \`${SHA1_VALUE:-Tidak ditemukan}\`"
            echo "- **SHA-256:** \`${SHA256_VALUE:-Tidak ditemukan}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit APK & update.json to Repository
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s || true)
          if echo "$COMMIT_MSG" | grep -q "\[skip ci\]"; then
            echo "Melewati commit ulang pada bot commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/tapak-latest.apk update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish APK & update.json [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Tidak ada perubahan untuk di-commit."
          fi
