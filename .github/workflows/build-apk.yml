name: Build TAPAK Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdlinetools.zip
            unzip -q /tmp/cmdlinetools.zip -d /tmp/cmdlinetools_extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdlinetools_extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdlinetools.zip /tmp/cmdlinetools_extract
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Prepare Consistent Debug Keystore
        run: |
          KS_PATH="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_PATH"
          elif [ ! -f "$KS_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=TAPAK, OU=Dev, O=TAPAK, L=Surabaya, S=East Java, C=ID" >/dev/null 2>&1
          fi

      - name: Clean and Build Debug APK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle clean assembleDebug --no-daemon

      - name: Sign APK and Extract SHA-1 & SHA-256
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          KS_PATH="$HOME/.android/debug.keystore"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"

          STORE_PASS="${STORE_PASS:-android}"
          KEY_ALIAS="${KEY_ALIAS:-androiddebugkey}"
          KEY_PASS="${KEY_PASS:-android}"

          if [ ! -f "$APK_PATH" ]; then
            echo "File APK tidak ditemukan di $APK_PATH"
            exit 1
          fi

          if command -v apksigner >/dev/null 2>&1 && [ -f "$KS_PATH" ]; then
            apksigner sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              "$APK_PATH"
          fi

          CERT_INFO=$(keytool -list -printcert -jarfile "$APK_PATH" 2>&1 || true)
          SHA1_VALUE=$(echo "$CERT_INFO" | grep -iE "SHA1|SHA-1" | head -n 1 | cut -d':' -f2- | xargs)
          SHA256_VALUE=$(echo "$CERT_INFO" | grep -iE "SHA256|SHA-256" | head -n 1 | cut -d':' -f2- | xargs)

          echo "APK File: $APK_PATH"
          echo "SHA-1: ${SHA1_VALUE:-Tidak ditemukan}"
          echo "SHA-256: ${SHA256_VALUE:-Tidak ditemukan}"

          {
            echo "### Android Signing Fingerprints"
            echo "- **APK:** \`$APK_PATH\`"
            echo "- **SHA-1:** \`${SHA1_VALUE:-Tidak ditemukan}\`"
            echo "- **SHA-256:** \`${SHA256_VALUE:-Tidak ditemukan}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPAK-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
